<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="calculator">
        <h1>Calculator</h1>
        <form id="calc-form" onsubmit="event.preventDefault(); submitCalculation();">
            <div class="input-group">
                <label for="operand1">First number</label>
                <input type="number" id="operand1" name="operand1" required step="any">
            </div>

            <div class="input-group">
                <label for="operator">Operator</label>
                <select id="operator" name="operator" required>
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>

            <div class="input-group">
                <label for="operand2">Second number</label>
                <input type="number" id="operand2" name="operand2" required step="any">
            </div>

            <button type="submit" id="calc-submit">Calculate</button>
        </form>

        <section id="result-section" class="hidden">
            <h2>Result</h2>
            <p id="result-value"></p>
        </section>

        <div id="error" class="error-message"></div>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
