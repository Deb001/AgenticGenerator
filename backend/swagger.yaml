openapi: 3.0.3
info:
  title: Portfolio Advisory API
  version: 1.0.0
servers:
  - url: http://localhost:{PORT}
    description: Local development server
    variables:
      PORT:
        default: "5000"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: advisor@example.com
        role:
          type: string
          enum: [advisor, client]
          example: advisor
    Portfolio:
      type: object
      properties:
        id:
          type: integer
          example: 10
        advisor_id:
          type: integer
          example: 1
        client_name:
          type: string
          example: "ABC Corp"
        holdings:
          type: string
          example: "AAPL, GOOGL, TSLA"
        historical_returns:
          type: array
          items:
            type: number
          example: [0.002, -0.001, 0.0005]
        signal:
          type: string
          enum: [Buy, Hold, Sell]
          example: Buy
security:
  - BearerAuth: []
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [advisor, client]
              required: [email, password, role]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Registration failed
  /api/auth/login:
    post:
      summary: Authenticate user and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials
  /api/portfolios:
    get:
      summary: Get all portfolios for authenticated advisor
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'
        '401':
          description: Unauthorized
  /api/portfolios/{id}:
    get:
      summary: Get a single portfolio by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Portfolio details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized