openapi: 3.0.3
info:
  title: Portfolio Advisory API
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /portfolios:
    get:
      summary: Get all portfolios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /portfolios/{id}:
    get:
      summary: Get portfolio detail by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Portfolio detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioDetail'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: advisor@example.com
        password:
          type: string
          format: password
          example: password123
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Invalid credentials
    PortfolioSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Growth Fund
        description:
          type: string
          example: Aggressive growth portfolio focusing on tech stocks.
        totalValue:
          type: number
          example: 1250000
    Holding:
      type: object
      properties:
        symbol:
          type: string
          example: AAPL
        quantity:
          type: number
          example: 150
        price:
          type: number
          example: 170
        marketValue:
          type: number
          example: 25500
    HistoryPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: 2024-01-01
        value:
          type: number
          example: 1200000
    PortfolioDetail:
      allOf:
        - $ref: '#/components/schemas/PortfolioSummary'
        - type: object
          properties:
            holdings:
              type: array
              items:
                $ref: '#/components/schemas/Holding'
            history:
              type: array
              items:
                $ref: '#/components/schemas/HistoryPoint'
