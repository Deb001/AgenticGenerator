version: '3.9'\nservices:\n  db:\n    image: postgres:15-alpine\n    environment:\n      POSTGRES_USER: ${POSTGRES_USER}\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}\n      POSTGRES_DB: ${POSTGRES_DB}\n    ports:\n      - "5432:5432"\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n\n  backend:\n    build: ./backend\n    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload\n    volumes:\n      - ./backend:/app\n    env_file:\n      - .env\n    ports:\n      - "8000:8000"\n    depends_on:\n      - db\n\n  frontend:\n    build: ./frontend\n    ports:\n      - "5173:5173"\n    env_file:\n      - .env\n    depends_on:\n      - backend\n\nvolumes:\n  pgdata: