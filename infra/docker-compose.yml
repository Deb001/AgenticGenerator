version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: portfolio_advisory
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:example@db:5432/portfolio_advisory
    ports:
      - "8000:8000"
volumes:
  db_data: