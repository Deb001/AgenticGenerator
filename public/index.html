<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Calculator</h1>
  </header>
  <main>
    <input type="text" id="display" readonly aria-label="Calculator display" autocomplete="off">
    <section id="keypad">
      <button type="button" data-key="7" aria-label="7">7</button>
      <button type="button" data-key="8" aria-label="8">8</button>
      <button type="button" data-key="9" aria-label="9">9</button>
      <button type="button" data-key="/" aria-label="divide">/</button>

      <button type="button" data-key="4" aria-label="4">4</button>
      <button type="button" data-key="5" aria-label="5">5</button>
      <button type="button" data-key="6" aria-label="6">6</button>
      <button type="button" data-key="*" aria-label="multiply">*</button>

      <button type="button" data-key="1" aria-label="1">1</button>
      <button type="button" data-key="2" aria-label="2">2</button>
      <button type="button" data-key="3" aria-label="3">3</button>
      <button type="button" data-key="-" aria-label="subtract">-</button>

      <button type="button" data-key="0" aria-label="0">0</button>
      <button type="button" data-key="." aria-label="decimal point">.</button>
      <button type="button" data-key="=" aria-label="equals">=</button>
      <button type="button" data-key="+" aria-label="add">+</button>

      <button type="button" data-key="C" aria-label="clear">C</button>
      <button type="button" data-key="(" aria-label="open parenthesis">(</button>
      <button type="button" data-key=")" aria-label="close parenthesis">)</button>
      <button type="button" data-key="Backspace" aria-label="delete last character">⌫</button>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
