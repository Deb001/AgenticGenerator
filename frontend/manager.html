<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Manager Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="manager.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
    }
  </style>
</head>
<body class="p-6">
  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6">
    <h1 class="text-3xl font-bold mb-4">Store Manager Dashboard</h1>
    <div class="flex items-center space-x-4 mb-6">
      <label for="storeSelect" class="font-medium">Store:</label>
      <select id="storeSelect" class="border rounded p-1"></select>
      <label for="weekStart" class="font-medium">Week Start:</label>
      <input type="date" id="weekStart" class="border rounded p-1"/>
      <button id="runBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Run Scheduler</button>
    </div>
    <div id="gridContainer" class="grid grid-cols-4 gap-2"></div>
    <div id="messageBox" class="mt-4 text-red-600"></div>
  </div>
</body>
</html>
