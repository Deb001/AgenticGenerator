<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main role="main" aria-label="Calculator Application">
    <section class="calculator" aria-labelledby="calc-title">
      <h1 id="calc-title" class="visually-hidden">Calculator</h1>
      <input
        type="text"
        id="calc-display"
        aria-live="polite"
        aria-atomic="true"
        readonly
        autocomplete="off"
        spellcheck="false"
        aria-label="Calculator display"
      />
      <div class="keypad" role="grid" aria-label="Calculator keypad">
        <!-- Row 1 -->
        <button data-action="clear" class="clear" role="gridcell" aria-label="Clear" tabindex="0">C</button>
        <button data-action="backspace" class="operator" role="gridcell" aria-label="Backspace" tabindex="0">←</button>
        <button data-action="operator" data-value="/" class="operator" role="gridcell" aria-label="Divide" tabindex="0">÷</button>
        <button data-action="operator" data-value="*" class="operator" role="gridcell" aria-label="Multiply" tabindex="0">×</button>
        <!-- Row 2 -->
        <button data-action="digit" data-value="7" role="gridcell" aria-label="Seven" tabindex="0">7</button>
        <button data-action="digit" data-value="8" role="gridcell" aria-label="Eight" tabindex="0">8</button>
        <button data-action="digit" data-value="9" role="gridcell" aria-label="Nine" tabindex="0">9</button>
        <button data-action="operator" data-value="-" class="operator" role="gridcell" aria-label="Subtract" tabindex="0">−</button>
        <!-- Row 3 -->
        <button data-action="digit" data-value="4" role="gridcell" aria-label="Four" tabindex="0">4</button>
        <button data-action="digit" data-value="5" role="gridcell" aria-label="Five" tabindex="0">5</button>
        <button data-action="digit" data-value="6" role="gridcell" aria-label="Six" tabindex="0">6</button>
        <button data-action="operator" data-value="+" class="operator" role="gridcell" aria-label="Add" tabindex="0">+</button>
        <!-- Row 4 -->
        <button data-action="digit" data-value="1" role="gridcell" aria-label="One" tabindex="0">1</button>
        <button data-action="digit" data-value="2" role="gridcell" aria-label="Two" tabindex="0">2</button>
        <button data-action="digit" data-value="3" role="gridcell" aria-label="Three" tabindex="0">3</button>
        <button data-action="equals" class="equals" role="gridcell" aria-label="Equals" tabindex="0">=</button>
        <!-- Row 5 -->
        <button data-action="digit" data-value="0" style="grid-column: span 2;" role="gridcell" aria-label="Zero" tabindex="0">0</button>
        <button data-action="decimal" role="gridcell" aria-label="Decimal point" tabindex="0">.</button>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
