<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="employee.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #e0f7fa, #80deea);
    }
  </style>
</head>
<body class="p-4">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-4">
    <h1 class="text-2xl font-semibold mb-3">My Weekly Schedule</h1>
    <input type="date" id="weekStart" class="border rounded p-1 mb-4"/>
    <ul id="scheduleList" class="space-y-2"></ul>
    <div id="toast" class="fixed bottom-4 right-4 hidden bg-green-600 text-white px-4 py-2 rounded shadow-lg"></div>
  </div>
</body>
</html>
