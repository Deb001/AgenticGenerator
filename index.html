<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <!-- Link to the stylesheet. Flask's url_for is used to correctly reference static files
         from the 'static/css' directory. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="calculator">
        <!-- Display area for numbers and calculation results.
             The 'id' attribute allows JavaScript to easily access and update this element. -->
        <div class="calculator-display" id="calculator-display">0</div>

        <div class="calculator-buttons">
            <!-- Clear button: Resets the calculator state. -->
            <button class="button clear" data-clear>AC</button>
            <!-- Operator button: Changes the sign of the current number. -->
            <button class="button operator" data-operator="negate">+/-</button>
            <!-- Operator button: Calculates percentage. -->
            <button class="button operator" data-operator="percent">%</button>
            <!-- Operator button: Division. -->
            <button class="button operator" data-operator="divide">/</button>

            <!-- Number buttons -->
            <button class="button number" data-number="7">7</button>
            <button class="button number" data-number="8">8</button>
            <button class="button number" data-number="9">9</button>
            <!-- Operator button: Multiplication. -->
            <button class="button operator" data-operator="multiply">*</button>

            <!-- Number buttons -->
            <button class="button number" data-number="4">4</button>
            <button class="button number" data-number="5">5</button>
            <button class="button number" data-number="6">6</button>
            <!-- Operator button: Subtraction. -->
            <button class="button operator" data-operator="subtract">-</button>

            <!-- Number buttons -->
            <button class="button number" data-number="1">1</button>
            <button class="button number" data-number="2">2</button>
            <button class="button number" data-number="3">3</button>
            <!-- Operator button: Addition. -->
            <button class="button operator" data-operator="add">+</button>

            <!-- Number button '0': Spans two columns for a common calculator layout. -->
            <button class="button number span-two-columns" data-number="0">0</button>
            <!-- Decimal point button. -->
            <button class="button decimal" data-decimal>.</button>
            <!-- Equals button: Triggers the calculation. -->
            <button class="button equals" data-equals>=</button>
        </div>
    </div>

    <!-- Link to the JavaScript file. Flask's url_for is used to correctly reference static files
         from the 'static/js' directory. Placed at the end of the body for performance. -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
