<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly aria-label="Calculator display">
    <div class="buttons">
      <!-- Row 1 -->
      <button data-token="7">7</button>
      <button data-token="8">8</button>
      <button data-token="9">9</button>
      <button data-token="/" class="operator">÷</button>
      <button data-token="sin(" class="function">sin</button>
      <!-- Row 2 -->
      <button data-token="4">4</button>
      <button data-token="5">5</button>
      <button data-token="6">6</button>
      <button data-token="*" class="operator">×</button>
      <button data-token="cos(" class="function">cos</button>
      <!-- Row 3 -->
      <button data-token="1">1</button>
      <button data-token="2">2</button>
      <button data-token="3">3</button>
      <button data-token="-" class="operator">−</button>
      <button data-token="tan(" class="function">tan</button>
      <!-- Row 4 -->
      <button data-token="0">0</button>
      <button data-token=".">.</button>
      <button data-token="(" >(</button>
      <button data-token=")" >)</button>
      <button data-token="+" class="operator">+</button>
      <!-- Row 5 -->
      <button data-token="log(" class="function">log</button>
      <button data-token="ln(" class="function">ln</button>
      <button data-token="sqrt(" class="function">√</button>
      <button data-token="exp(" class="function">exp</button>
      <button data-token="^" class="operator">^</button>
      <!-- Row 6 -->
      <button data-token="pi" class="constant">π</button>
      <button data-token="e" class="constant">e</button>
      <button id="clear">C</button>
      <button id="backspace">⌫</button>
      <button id="equals">=</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
