<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator">
        <!-- Display -->
        <input type="text" id="calc-display" class="calc-display" readonly aria-label="Calculator display">

        <!-- Buttons -->
        <section class="calc-buttons">
            <!-- Row 1 -->
            <button type="button" class="calc-button" data-action="clear">C</button>
            <button type="button" class="calc-button" data-action="operator" data-value="/">÷</button>
            <button type="button" class="calc-button" data-action="operator" data-value="*">×</button>
            <button type="button" class="calc-button" data-action="operator" data-value="-">−</button>

            <!-- Row 2 -->
            <button type="button" class="calc-button" data-action="digit" data-value="7">7</button>
            <button type="button" class="calc-button" data-action="digit" data-value="8">8</button>
            <button type="button" class="calc-button" data-action="digit" data-value="9">9</button>
            <button type="button" class="calc-button" data-action="operator" data-value="+">+</button>

            <!-- Row 3 -->
            <button type="button" class="calc-button" data-action="digit" data-value="4">4</button>
            <button type="button" class="calc-button" data-action="digit" data-value="5">5</button>
            <button type="button" class="calc-button" data-action="digit" data-value="6">6</button>
            <button type="button" class="calc-button" data-action="equals">=</button>

            <!-- Row 4 -->
            <button type="button" class="calc-button" data-action="digit" data-value="1">1</button>
            <button type="button" class="calc-button" data-action="digit" data-value="2">2</button>
            <button type="button" class="calc-button" data-action="digit" data-value="3">3</button>
            <button type="button" class="calc-button" data-action="decimal" data-value=".">.</button>

            <!-- Row 5 -->
            <button type="button" class="calc-button calc-zero" data-action="digit" data-value="0">0</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
