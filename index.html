<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arithmetic Web Calculator</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Arithmetic Calculator</h1>
    <section id="calculator">
        <form id="calc-form" novalidate>
            <div class="calc-grid">
                <label for="input-a">First Number</label>
                <input type="number" id="input-a" required aria-required="true" step="any">

                <label for="input-b">Second Number</label>
                <input type="number" id="input-b" required aria-required="true" step="any">

                <label for="operator">Operation</label>
                <select id="operator" required aria-required="true">
                    <option value="add">Add (+)</option>
                    <option value="sub">Subtract (−)</option>
                    <option value="mul">Multiply (×)</option>
                    <option value="div">Divide (÷)</option>
                </select>

                <button type="submit" id="calculate">Calculate</button>
            </div>
        </form>
        <div id="result" role="alert" aria-live="assertive"></div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
