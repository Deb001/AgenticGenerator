<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" role="application" aria-label="Simple calculator">
        <input type="text"
               id="display"
               class="calc-display"
               readonly
               aria-live="polite"
               aria-label="Calculator display"
               autocomplete="off"
               spellcheck="false">
        <section class="calc-keypad">
            <!-- Row 1 -->
            <button id="btn-clear" class="calc-button" aria-label="Clear">C</button>
            <button id="btn-del" class="calc-button" aria-label="Delete">DEL</button>
            <button id="btn-open-paren" class="calc-button" aria-label="Open parenthesis">(</button>
            <button id="btn-close-paren" class="calc-button" aria-label="Close parenthesis">)</button>

            <!-- Row 2 -->
            <button id="btn-7" class="calc-button" aria-label="Seven">7</button>
            <button id="btn-8" class="calc-button" aria-label="Eight">8</button>
            <button id="btn-9" class="calc-button" aria-label="Nine">9</button>
            <button id="btn-divide" class="calc-button" aria-label="Divide">÷</button>

            <!-- Row 3 -->
            <button id="btn-4" class="calc-button" aria-label="Four">4</button>
            <button id="btn-5" class="calc-button" aria-label="Five">5</button>
            <button id="btn-6" class="calc-button" aria-label="Six">6</button>
            <button id="btn-multiply" class="calc-button" aria-label="Multiply">×</button>

            <!-- Row 4 -->
            <button id="btn-1" class="calc-button" aria-label="One">1</button>
            <button id="btn-2" class="calc-button" aria-label="Two">2</button>
            <button id="btn-3" class="calc-button" aria-label="Three">3</button>
            <button id="btn-minus" class="calc-button" aria-label="Minus">−</button>

            <!-- Row 5 -->
            <button id="btn-0" class="calc-button" aria-label="Zero">0</button>
            <button id="btn-decimal" class="calc-button" aria-label="Decimal point">.</button>
            <button id="btn-equals" class="calc-button" aria-label="Equals">=</button>
            <button id="btn-plus" class="calc-button" aria-label="Plus">+</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
