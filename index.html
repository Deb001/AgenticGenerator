<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- JavaScript -->
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
    <div class="calculator">
        <h1>Simple Calculator</h1>
        <!-- Display -->
        <input type="text" id="display" class="display" readonly aria-label="Calculator display">
        <!-- Buttons -->
        <div class="buttons">
            <button type="button" class="btn clear" aria-label="Clear">C</button>
            <button type="button" class="btn operator" data-op="/" aria-label="Divide">÷</button>
            <button type="button" class="btn operator" data-op="*" aria-label="Multiply">×</button>
            <button type="button" class="btn operator" data-op="-" aria-label="Subtract">−</button>

            <button type="button" class="btn digit" data-digit="7">7</button>
            <button type="button" class="btn digit" data-digit="8">8</button>
            <button type="button" class="btn digit" data-digit="9">9</button>
            <button type="button" class="btn operator" data-op="+" aria-label="Add">+</button>

            <button type="button" class="btn digit" data-digit="4">4</button>
            <button type="button" class="btn digit" data-digit="5">5</button>
            <button type="button" class="btn digit" data-digit="6">6</button>
            <button type="button" class="btn equals" aria-label="Equals">=</button>

            <button type="button" class="btn digit" data-digit="1">1</button>
            <button type="button" class="btn digit" data-digit="2">2</button>
            <button type="button" class="btn digit" data-digit="3">3</button>

            <button type="button" class="btn digit zero" data-digit="0">0</button>
            <button type="button" class="btn decimal" data-decimal="." aria-label="Decimal point">.</button>
        </div>
    </div>

    <!-- Error message container -->
    <div id="error" class="error-message" role="alert" aria-live="assertive"></div>
</body>
</html>
