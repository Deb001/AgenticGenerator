<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Simple calculator">
    <div id="display" class="calculator-display" role="textbox" aria-live="polite" tabindex="0"></div>
    <div class="calculator-keys">
      <button type="button" class="key" data-action="clear" aria-label="Clear">C</button>
      <button type="button" class="key" data-action="divide" aria-label="Divide">÷</button>
      <button type="button" class="key" data-action="multiply" aria-label="Multiply">×</button>
      <button type="button" class="key" data-action="backspace" aria-label="Backspace">⌫</button>

      <button type="button" class="key" data-action="digit" data-value="7">7</button>
      <button type="button" class="key" data-action="digit" data-value="8">8</button>
      <button type="button" class="key" data-action="digit" data-value="9">9</button>
      <button type="button" class="key" data-action="subtract" aria-label="Subtract">−</button>

      <button type="button" class="key" data-action="digit" data-value="4">4</button>
      <button type="button" class="key" data-action="digit" data-value="5">5</button>
      <button type="button" class="key" data-action="digit" data-value="6">6</button>
      <button type="button" class="key" data-action="add" aria-label="Add">+</button>

      <button type="button" class="key" data-action="digit" data-value="1">1</button>
      <button type="button" class="key" data-action="digit" data-value="2">2</button>
      <button type="button" class="key" data-action="digit" data-value="3">3</button>
      <button type="button" class="key equals" data-action="equals" aria-label="Equals">=</button>

      <button type="button" class="key zero" data-action="digit" data-value="0">0</button>
      <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
