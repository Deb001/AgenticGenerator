<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div id="calculator">
    <input id="display" type="text" readonly aria-label="Calculator display">
    <div class="button-grid">
      <button class="calc-button" data-key="digit-7" aria-label="seven">7</button>
      <button class="calc-button" data-key="digit-8" aria-label="eight">8</button>
      <button class="calc-button" data-key="digit-9" aria-label="nine">9</button>
      <button class="calc-button" data-key="operator-divide" aria-label="divide">÷</button>

      <button class="calc-button" data-key="digit-4" aria-label="four">4</button>
      <button class="calc-button" data-key="digit-5" aria-label="five">5</button>
      <button class="calc-button" data-key="digit-6" aria-label="six">6</button>
      <button class="calc-button" data-key="operator-multiply" aria-label="multiply">×</button>

      <button class="calc-button" data-key="digit-1" aria-label="one">1</button>
      <button class="calc-button" data-key="digit-2" aria-label="two">2</button>
      <button class="calc-button" data-key="digit-3" aria-label="three">3</button>
      <button class="calc-button" data-key="operator-subtract" aria-label="subtract">−</button>

      <button class="calc-button" data-key="digit-0" aria-label="zero">0</button>
      <button class="calc-button" data-key="decimal-point" aria-label="decimal point">.</button>
      <button class="calc-button" data-key="equals" aria-label="equals">=</button>
      <button class="calc-button" data-key="operator-add" aria-label="add">+</button>
    </div>
  </div>
</body>
</html>
