<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section role="region" aria-label="Calculator display">
    <input type="text" id="calc-display" readonly aria-live="polite">
  </section>

  <section role="grid" aria-label="Calculator keypad">
    <button class="calc-button" data-token="C" aria-label="Clear">C</button>
    <button class="calc-button" data-token="%" aria-label="Percent">%</button>
    <button class="calc-button" data-token="/" aria-label="Divide">÷</button>
    <button class="calc-button" data-token="*" aria-label="Multiply">×</button>

    <button class="calc-button" data-token="7" aria-label="Seven">7</button>
    <button class="calc-button" data-token="8" aria-label="Eight">8</button>
    <button class="calc-button" data-token="9" aria-label="Nine">9</button>
    <button class="calc-button" data-token="-" aria-label="Subtract">−</button>

    <button class="calc-button" data-token="4" aria-label="Four">4</button>
    <button class="calc-button" data-token="5" aria-label="Five">5</button>
    <button class="calc-button" data-token="6" aria-label="Six">6</button>
    <button class="calc-button" data-token="+" aria-label="Add">+</button>

    <button class="calc-button" data-token="1" aria-label="One">1</button>
    <button class="calc-button" data-token="2" aria-label="Two">2</button>
    <button class="calc-button" data-token="3" aria-label="Three">3</button>
    <button class="calc-button" data-token="=" aria-label="Equals">=</button>

    <button class="calc-button" data-token="0" aria-label="Zero">0</button>
    <button class="calc-button" data-token="." aria-label="Decimal point">.</button>
    <button class="calc-button" data-token="±" aria-label="Toggle sign">±</button>
    <button class="calc-button" data-token="Backspace" aria-label="Backspace">←</button>
  </section>

  <script src="app.js" defer></script>
</body>
</html>
