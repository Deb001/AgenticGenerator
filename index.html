<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="calculator-display" readonly>

    <div class="buttons">
      <!-- Clear -->
      <button type="button" data-clear>AC</button>

      <!-- Operators -->
      <button type="button" data-operator data-value="÷">÷</button>
      <button type="button" data-operator data-value="×">×</button>
      <button type="button" data-operator data-value="-">−</button>
      <button type="button" data-operator data-value="+">+</button>

      <!-- Digits -->
      <button type="button" data-digit data-value="7">7</button>
      <button type="button" data-digit data-value="8">8</button>
      <button type="button" data-digit data-value="9">9</button>

      <button type="button" data-digit data-value="4">4</button>
      <button type="button" data-digit data-value="5">5</button>
      <button type="button" data-digit data-value="6">6</button>

      <button type="button" data-digit data-value="1">1</button>
      <button type="button" data-digit data-value="2">2</button>
      <button type="button" data-digit data-value="3">3</button>

      <button type="button" data-digit data-value="0">0</button>
      <button type="button" data-decimal>. </button>

      <!-- Equals -->
      <button type="button" data-equals>=</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
