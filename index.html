<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <main class="calculator" role="application" aria-label="Simple calculator">
    <!-- Display -->
    <input type="text"
           id="display"
           class="calculator-display"
           aria-label="Calculator display"
           readonly
           autocomplete="off"
           autocapitalize="off"
           spellcheck="false">

    <!-- Buttons -->
    <section class="calculator-buttons">
      <!-- Row 1 -->
      <button type="button" class="calc-button" data-value="7" aria-label="seven">7</button>
      <button type="button" class="calc-button" data-value="8" aria-label="eight">8</button>
      <button type="button" class="calc-button" data-value="9" aria-label="nine">9</button>
      <button type="button" class="calc-button operator" data-value="/" aria-label="divide">÷</button>

      <!-- Row 2 -->
      <button type="button" class="calc-button" data-value="4" aria-label="four">4</button>
      <button type="button" class="calc-button" data-value="5" aria-label="five">5</button>
      <button type="button" class="calc-button" data-value="6" aria-label="six">6</button>
      <button type="button" class="calc-button operator" data-value="*" aria-label="multiply">×</button>

      <!-- Row 3 -->
      <button type="button" class="calc-button" data-value="1" aria-label="one">1</button>
      <button type="button" class="calc-button" data-value="2" aria-label="two">2</button>
      <button type="button" class="calc-button" data-value="3" aria-label="three">3</button>
      <button type="button" class="calc-button operator" data-value="-" aria-label="subtract">−</button>

      <!-- Row 4 -->
      <button type="button" class="calc-button" data-value="0" aria-label="zero">0</button>
      <button type="button" class="calc-button" data-value="." aria-label="decimal point">.</button>
      <button type="button" class="calc-button equals" data-action="equals" aria-label="equals">=</button>
      <button type="button" class="calc-button operator" data-value="+" aria-label="add">+</button>

      <!-- Row 5 (functions) -->
      <button type="button" class="calc-button function" data-action="clear" aria-label="clear">C</button>
      <button type="button" class="calc-button function" data-action="backspace" aria-label="backspace">←</button>
      <button type="button" class="calc-button function" data-value="(" aria-label="open parenthesis">(</button>
      <button type="button" class="calc-button function" data-value=")" aria-label="close parenthesis">)</button>
    </section>
  </main>

  <script defer src="src/js/calculator.js"></script>
  <script defer src="src/js/ui.js"></script>
</body>
</html>
