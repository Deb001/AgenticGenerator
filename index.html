<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <h2>Calculator</h2>
    <label for="operand1">First Number:</label>
    <input type="number" id="operand1" placeholder="Enter first number">

    <label for="operand2">Second Number:</label>
    <input type="number" id="operand2" placeholder="Enter second number">

    <label for="operator">Operation:</label>
    <select id="operator">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (-)</option>
      <option value="*">Multiplication (*)</option>
      <option value="/">Division (/)</option>
    </select>

    <button id="calculateBtn">Calculate</button>

    <div id="result" aria-live="polite"></div>
    <div id="error" class="error" aria-live="assertive"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
