<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calculator {
            max-width: 300px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .display {
            height: 60px;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 5px;
            overflow: hidden;
        }
        .btn-calc {
            width: 100%;
            height: 50px;
            font-size: 18px;
            margin: 5px 0;
        }
        .btn-operation {
            background-color: #fd7e14;
            color: white;
        }
        .btn-equals {
            background-color: #0d6efd;
            color: white;
        }
        .btn-clear {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display" id="display">0</div>
            <div class="row">
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('7')">7</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('8')">8</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('9')">9</button></div>
                <div class="col-3"><button class="btn btn-operation btn-calc" onclick="setOperation('/')">/</button></div>
            </div>
            <div class="row">
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('4')">4</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('5')">5</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('6')">6</button></div>
                <div class="col-3"><button class="btn btn-operation btn-calc" onclick="setOperation('*')">×</button></div>
            </div>
            <div class="row">
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('1')">1</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('2')">2</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('3')">3</button></div>
                <div class="col-3"><button class="btn btn-operation btn-calc" onclick="setOperation('-')">-</button></div>
            </div>
            <div class="row">
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('0')">0</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc" onclick="appendToDisplay('.')">.</button></div>
                <div class="col-3"><button class="btn btn-equals btn-calc" onclick="calculate()">=</button></div>
                <div class="col-3"><button class="btn btn-operation btn-calc" onclick="setOperation('+')">+</button></div>
            </div>
            <div class="row">
                <div class="col-12">
                    <button class="btn btn-clear btn-calc" onclick="clearDisplay()">C</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetScreen = false;

        const display = document.getElementById('display');

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendToDisplay(number) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = number;
                shouldResetScreen = false;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function setOperation(op) {
            if (operation !== null) calculate();
            previousInput = currentInput;
            operation = op;
            shouldResetScreen = true;
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        alert('Cannot divide by zero');
                        clearDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }
            
            currentInput = computation.toString();
            operation = null;
            previousInput = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            shouldResetScreen = false;
            updateDisplay();
        }

        // Initialize display
        updateDisplay();
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
