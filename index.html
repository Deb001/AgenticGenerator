<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div id="display" aria-label="calculator display" role="textbox" aria-readonly="true"></div>
    <div class="buttons">
      <button type="button" class="calc-button" data-key="C">C</button>
      <button type="button" class="calc-button" data-key="⌫">⌫</button>
      <button type="button" class="calc-button" data-key="/">÷</button>
      <button type="button" class="calc-button" data-key="*">×</button>

      <button type="button" class="calc-button" data-key="7">7</button>
      <button type="button" class="calc-button" data-key="8">8</button>
      <button type="button" class="calc-button" data-key="9">9</button>
      <button type="button" class="calc-button" data-key="+">+</button>

      <button type="button" class="calc-button" data-key="4">4</button>
      <button type="button" class="calc-button" data-key="5">5</button>
      <button type="button" class="calc-button" data-key="6">6</button>
      <button type="button" class="calc-button" data-key="-">−</button>

      <button type="button" class="calc-button" data-key="1">1</button>
      <button type="button" class="calc-button" data-key="2">2</button>
      <button type="button" class="calc-button" data-key="3">3</button>
      <button type="button" class="calc-button" data-key="*">×</button>

      <button type="button" class="calc-button" data-key="0">0</button>
      <button type="button" class="calc-button" data-key=".">.</button>
      <button type="button" class="calc-button" data-key="=">=</button>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
