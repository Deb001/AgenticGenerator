<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="calculator" role="application" aria-label="Simple calculator">
        <input id="display" type="text" aria-label="Calculator display" readonly>
        <div class="buttons">
            <!-- Row 1 -->
            <button class="calc-btn" data-action="clear" data-value="C" role="button" aria-label="Clear" type="button">C</button>
            <button class="calc-btn" data-action="backspace" data-value="←" role="button" aria-label="Backspace" type="button">←</button>
            <button class="calc-btn" data-action="operator" data-value="÷" role="button" aria-label="Divide" type="button">÷</button>
            <button class="calc-btn" data-action="operator" data-value="×" role="button" aria-label="Multiply" type="button">×</button>

            <!-- Row 2 -->
            <button class="calc-btn" data-action="digit" data-value="7" role="button" aria-label="Digit 7" type="button">7</button>
            <button class="calc-btn" data-action="digit" data-value="8" role="button" aria-label="Digit 8" type="button">8</button>
            <button class="calc-btn" data-action="digit" data-value="9" role="button" aria-label="Digit 9" type="button">9</button>
            <button class="calc-btn" data-action="operator" data-value="-" role="button" aria-label="Subtract" type="button">‑</button>

            <!-- Row 3 -->
            <button class="calc-btn" data-action="digit" data-value="4" role="button" aria-label="Digit 4" type="button">4</button>
            <button class="calc-btn" data-action="digit" data-value="5" role="button" aria-label="Digit 5" type="button">5</button>
            <button class="calc-btn" data-action="digit" data-value="6" role="button" aria-label="Digit 6" type="button">6</button>
            <button class="calc-btn" data-action="operator" data-value="+" role="button" aria-label="Add" type="button">+</button>

            <!-- Row 4 -->
            <button class="calc-btn" data-action="digit" data-value="1" role="button" aria-label="Digit 1" type="button">1</button>
            <button class="calc-btn" data-action="digit" data-value="2" role="button" aria-label="Digit 2" type="button">2</button>
            <button class="calc-btn" data-action="digit" data-value="3" role="button" aria-label="Digit 3" type="button">3</button>
            <button class="calc-btn" data-action="equals" data-value="=" role="button" aria-label="Equals" type="button">=</button>

            <!-- Row 5 -->
            <button class="calc-btn" data-action="digit" data-value="0" role="button" aria-label="Digit 0" type="button" style="grid-column: span 2;">0</button>
            <button class="calc-btn" data-action="decimal" data-value="." role="button" aria-label="Decimal point" type="button">.</button>
        </div>
    </section>

    <script src="app.js" defer></script>
</body>
</html>
