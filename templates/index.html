<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <!-- Link to the shared stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="calculator">
        <h1>Simple Calculator</h1>

        <!-- Display error messages, if any -->
        {% if error %}
            <div class="alert alert-error" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <!-- Display calculation result, if any -->
        {% if result is not none %}
            <div class="alert alert-success" role="alert">
                Result: <strong>{{ result }}</strong>
            </div>
        {% endif %}

        <!-- Calculator input form -->
        <form action="{{ url_for('index') }}" method="post" class="calc-form" novalidate>
            <div class="form-group">
                <label for="num1">First Number</label>
                <input type="number" step="any" id="num1" name="num1" required
                       value="{{ request.form.num1 or '' }}">
            </div>

            <div class="form-group">
                <label for="operator">Operator</label>
                <select id="operator" name="operator" required>
                    <option value="+" {% if request.form.operator == '+' %}selected{% endif %}>+</option>
                    <option value="-" {% if request.form.operator == '-' %}selected{% endif %}>-</option>
                    <option value="*" {% if request.form.operator == '*' %}selected{% endif %}>×</option>
                    <option value="/" {% if request.form.operator == '/' %}selected{% endif %}>÷</option>
                </select>
            </div>

            <div class="form-group">
                <label for="num2">Second Number</label>
                <input type="number" step="any" id="num2" name="num2" required
                       value="{{ request.form.num2 or '' }}">
            </div>

            <button type="submit" class="btn-primary">Calculate</button>
        </form>
    </main>
</body>
</html>
