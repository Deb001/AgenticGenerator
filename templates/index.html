<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <!-- Bootstrap 5 CDN for responsive styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUa6mZ+1y5G7cX0p4K8Yh9Q2Wf3vZl5qz7oV6b+N8nYh1yJ3fZ4c5q7a0Q9s" crossorigin="anonymous">
    <style>
        body { padding-top: 2rem; }
        .result, .error { margin-top: 1rem; }
    </style>
</head>
<body class="container">
<h1 class="mb-4">Calculator</h1>

<form action="{{ url_for('calculate') }}" method="post" class="row g-3">
    <div class="col-md-4">
        <label for="num1" class="form-label">Number 1</label>
        <input type="number" step="any" class="form-control" id="num1" name="num1"
               value="{{ request.form.num1 or '' }}" required>
    </div>

    <div class="col-md-4">
        <label for="num2" class="form-label">Number 2</label>
        <input type="number" step="any" class="form-control" id="num2" name="num2"
               value="{{ request.form.num2 or '' }}" required>
    </div>

    <div class="col-md-4">
        <label for="operation" class="form-label">Operation</label>
        <select class="form-select" id="operation" name="operation" required>
            {% for op in ['add', 'subtract', 'multiply', 'divide'] %}
                <option value="{{ op }}"
                    {% if request.form.operation == op %}selected{% endif %}>
                    {{ op|capitalize }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary">Calculate</button>
    </div>
</form>

{% if result is defined %}
<div class="alert alert-success result" role="alert">
    Result: {{ result }}
</div>
{% endif %}

{% if error is defined %}
<div class="alert alert-danger error" role="alert">
    Error: {{ error }}
</div>
{% endif %}
</body>
</html>
