<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="calculator">
        <h1>Calculator</h1>
        <form id="calc-form" autocomplete="off" aria-label="Calculator form">
            <label for="expression">Enter expression:</label>
            <input type="text"
                   id="expression"
                   name="expression"
                   placeholder="e.g., 2 + 2 * 3"
                   required
                   aria-required="true"
                   aria-describedby="expr-help">
            <small id="expr-help" class="help-text">
                Use basic arithmetic operators (+, -, *, /). No variables or functions allowed.
            </small>
            <button type="submit">Calculate</button>
        </form>
        <section id="result-section" aria-live="polite" aria-atomic="true">
            <h2>Result</h2>
            <p id="result">--</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
